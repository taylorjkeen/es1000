    #app{height:100dvh;display:flex;flex-direction:column;max-width:430px;margin:0 auto}
    .hdr{padding:20px 20px 0;border-bottom:1px solid #243546;flex-shrink:0}
    .hdr-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
    .ttl{font-size:22px;font-weight:800;letter-spacing:-.5px}.ttl span{color:#00A86B}
    .sub{font-size:12px;color:#8BA0B4;margin-top:2px}
    .hdr-r{text-align:right;font-size:11px;color:#8BA0B4}
    .hacc{font-size:13px;color:#E8B45A;font-weight:700}
    .pbar{background:#243546;border-radius:3px;height:3px;margin-bottom:14px;overflow:hidden}
    .pfill{height:100%;background:linear-gradient(90deg,#00A86B,#E8B45A);border-radius:3px;transition:width .4s}
    .tabs{display:flex}
    .tbtn{flex:1;background:none;border:none;border-bottom:2px solid transparent;padding:10px 4px;color:#8BA0B4;font-size:11px;cursor:pointer;letter-spacing:.5px;transition:all .15s}

    .tico{font-size:18px;margin-bottom:2px}
    .fbar{padding:12px 20px 0;flex-shrink:0;display:flex;gap:8px;flex-wrap:wrap}

    .fbtn{background:#172330;border:1px solid #243546;border-radius:10px;padding:8px 12px;color:#8BA0B4;font-size:13px;cursor:pointer;white-space:nowrap}

    .cnt{flex:1;padding:16px 20px 80px;overflow-y:auto;-webkit-overflow-scrolling:touch}

    .cword{font-size:42px;font-weight:700;color:#F5EDD6;text-align:center;letter-spacing:-.5px}

    .chint{font-size:13px;color:#8BA0B4}
    .cbadges{position:absolute;top:16px;right:16px;display:flex;gap:6px}
    .bdg{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:2px 6px;border-radius:4px}
    .brank{color:#8BA0B4;background:#243546}
    .bmx{color:#E8B45A;background:rgba(200,151,58,.15)}
    .pverb{color:#5B9BD5;background:rgba(91,155,213,.15)}
    .pnoun{color:#50C878;background:rgba(80,200,120,.15)}
    .padj{color:#FFB347;background:rgba(255,179,71,.15)}
    .padv{color:#DA70D6;background:rgba(218,112,214,.15)}
    .pprep{color:#87CEEB;background:rgba(135,206,235,.15)}
    .pconj{color:#DDA0DD;background:rgba(221,160,221,.15)}
    .ppron{color:#F0E68C;background:rgba(240,230,140,.15)}
    .pdet{color:#B8860B;background:rgba(184,134,11,.15)}
    .part{color:#A9A9A9;background:rgba(169,169,169,.15)}
    .pnum{color:#FFD700;background:rgba(255,215,0,.15)}
    .pinterj{color:#FF6B6B;background:rgba(255,107,107,.15)}
    .pother{color:#808080;background:rgba(128,128,128,.15)}

    .btn{border:none;border-radius:14px;padding:14px;font-size:20px;font-weight:700;cursor:pointer;width:100%}
    .bwrong{background:rgba(192,57,43,.15);border:1px solid #C0392B;color:#E74C3C}
    .bskip{background:#243546;border:1px solid #243546;color:#8BA0B4;font-size:16px}
    .bright{background:rgba(0,104,71,.2);border:1px solid #00A86B;color:#00A86B}

    .dbtn{font-size:11px;color:#8BA0B4;background:#243546;border:none;border-radius:6px;padding:3px 8px;cursor:pointer}
    .obtn{background:#172330;border:1px solid #243546;border-radius:14px;padding:15px 20px;color:#F5EDD6;font-size:16px;cursor:pointer;text-align:left;width:100%;margin-bottom:10px;transition:all .15s}
    .obtn.cor{background:rgba(0,104,71,.2);border-color:#00A86B;color:#00A86B;font-weight:700}
    .obtn.wrg{background:rgba(192,57,43,.15);border-color:#E74C3C;color:#E74C3C}
    .obtn.dim{color:#8BA0B4}
    .obtn:disabled{cursor:default}
    .pcard{background:#172330;border:1px solid #243546;border-radius:20px;padding:28px 24px;text-align:center;margin-bottom:12px}
    .plbl{font-size:13px;color:#8BA0B4;margin-bottom:8px}
    .pword{font-size:38px;font-weight:700;color:#F5EDD6;margin-bottom:12px}
    .pbadges{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
    .sinp{background:#172330;border:1px solid #243546;border-radius:12px;padding:12px 16px;color:#F5EDD6;font-size:15px;outline:none;width:100%;margin-bottom:8px}

    .li{background:#172330;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;margin-bottom:2px;border-left:3px solid #243546}

    .lword{font-size:17px;font-weight:700;color:#F5EDD6;min-width:85px}

const W=RAW.map(([r,w,t,p,m])=>({rank:r,word:w,translations:t,pos:p,mx:!!m}));
let P={correct:{},incorrect:{},seen:{}};
let F={pos:'all',mx:false};
let tab='cards';
let cPool=[],cIdx=0,cFlip=false,cDir='es-en',cSes={c:0,w:0};
let qPool=[],qIdx=0,qQ=null,qCh=null,qSes={c:0,w:0};
let lPage=0,lQ='';
const PP=30;

function lp(){try{const r=localStorage.getItem('sp1000_p');if(r)P=JSON.parse(r);}catch{}}
function sp(){try{localStorage.setItem('sp1000_p',JSON.stringify(P));}catch{}}
function sh(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function gp(){let p=W;if(F.mx)p=p.filter(w=>w.mx);if(F.pos!=='all')p=p.filter(w=>w.pos===F.pos);return p;}
function ptag(p){return `<span class="bdg p${p}">${p}</span>`;}
function rb(r){return `<span class="bdg brank">#${r}</span>`;}
function mb(){return '<span class="bdg bmx">🇲🇽 MX</span>';}

function uh(){
  document.getElementById('hsub').textContent=tab==='top'?'1000mostcommonwords.com':'RAE CREA · CORPES México';
  if(tab==='top'){
    const n=Object.keys(TP.l).length;
    document.getElementById('sc').textContent=n+' / 1000 learned';
    document.getElementById('ha').textContent='';
    document.getElementById('pf').style.width=(n/10)+'%';
    return;
  }
  const s=Object.keys(P.seen).length;
  const c=Object.values(P.correct).reduce((a,b)=>a+b,0);
  const i=Object.values(P.incorrect).reduce((a,b)=>a+b,0);
  const t=c+i;
  document.getElementById('sc').textContent=s+' / '+W.length+' seen';
  const a=document.getElementById('ha');
  a.textContent=t>0?Math.round(c/t*100)+'% accuracy':'';
  document.getElementById('pf').style.width=(s/W.length*100)+'%';
}

function sw(t){
  tab=t;uh();
  ['top','cards','quiz','list','stats'].forEach(x=>document.getElementById('t-'+x).classList.toggle('on',x===t));
  document.getElementById('fb').style.display=t==='stats'||t==='top'?'none':'flex';
  try{localStorage.setItem('es1000_tab',t);}catch{}
  if(t==='top'){if(!tQ)tnext();trender();}
  else if(t==='cards'){ic();rc();}
  else if(t==='quiz'){iq();rq();}
  else if(t==='list'){lPage=0;lQ='';rl();}
  else rs();
}

function af(){F.pos=document.getElementById('pf2').value;if(tab==='cards'){ic();rc();}else if(tab==='quiz'){iq();rq();}else if(tab==='list'){lPage=0;rl();}}
function tmx(){F.mx=!F.mx;document.getElementById('mxb').classList.toggle('on',F.mx);af();}
function rf(){F={pos:'all',mx:false};document.getElementById('pf2').value='all';document.getElementById('mxb').classList.remove('on');af();}

// CARDS
function ic(){cPool=sh(gp());cIdx=0;cFlip=false;cSes={c:0,w:0};}
function rc(){
  const el=document.getElementById('cnt');
  if(!cPool.length){el.innerHTML='<p class="emp">No words match.</p>';return;}
  const w=cPool[cIdx%cPool.length];
  const front=cDir==='es-en'?w.word:w.translations[0];
  const back=cDir==='es-en'?w.translations.join(' · '):w.word;
  const t=cSes.c+cSes.w,acc=t>0?Math.round(cSes.c/t*100)+'%':'';
  el.innerHTML=`
    <div class="srow">
      <span class="sm">Card ${cIdx+1}</span>
      <div style="display:flex;gap:12px"><span class="sc">✓ ${cSes.c}</span><span class="sw">✗ ${cSes.w}</span>${acc?`<span class="sa">${acc}</span>`:''}</div>
      <button class="dbtn" onclick="td()">${cDir==='es-en'?'ES→EN':'EN→ES'}</button>
    </div>
    <div class="card${cFlip?' rv':''}" onclick="fc()">
      <div class="cbadges">${rb(w.rank)}${w.mx?mb():''}</div>
      <div class="${cFlip?'cback':'cword'}">${cFlip?back:front}</div>
      ${!cFlip?'<div class="chint">tap to reveal</div>':''}
      ${cFlip?`<div class="fg">${ptag(w.pos)}</div>`:''}
    </div>
    ${cFlip?`<div class="brow"><button class="btn bwrong" onclick="cn('w')">✗</button><button class="btn bskip" onclick="cn('s')">→</button><button class="btn bright" onclick="cn('r')">✓</button></div>`:`<button class="bprim" onclick="fc()">Reveal</button>`}`;
}
function fc(){cFlip=!cFlip;rc();}
function td(){cDir=cDir==='es-en'?'en-es':'es-en';cFlip=false;rc();}
function cn(r){
  const w=cPool[cIdx%cPool.length];
  P.seen[w.rank]=true;
  if(r==='r'){P.correct[w.rank]=(P.correct[w.rank]||0)+1;cSes.c++;}
  else if(r==='w'){P.incorrect[w.rank]=(P.incorrect[w.rank]||0)+1;cSes.w++;}
  sp();uh();cIdx++;cFlip=false;rc();
}

// QUIZ
function iq(){qPool=sh(gp());qIdx=0;qQ=null;qCh=null;qSes={c:0,w:0};bq();}
function bq(){
  if(!qPool.length)return;
  const w=qPool[qIdx%qPool.length];
  const cor=w.translations[0];
  const sp2=W.filter(x=>x.pos===w.pos&&x.rank!==w.rank);
  const pool=sp2.length>=3?sp2:W.filter(x=>x.rank!==w.rank);
  const dis=sh(pool).slice(0,3).map(x=>x.translations[0]);
  const opts=sh([cor,...dis]);
  qQ={word:w,correct:cor,options:opts};qCh=null;
}
function rq(){
  const el=document.getElementById('cnt');
  if(!qPool.length){el.innerHTML='<p class="emp">No words match.</p>';return;}
  const q=qQ,t=qSes.c+qSes.w,acc=t>0?Math.round(qSes.c/t*100)+'%':'';
  const opts=q.options.map((o,i)=>{
    let cls='obtn';
    if(qCh){if(o===q.correct)cls+=' cor';else if(o===qCh)cls+=' wrg';else cls+=' dim';}
    const safe=o.replace(/'/g,"\'");
    return `<button class="${cls}" ${qCh?'disabled':''} onclick="pq('${safe}')">${String.fromCharCode(65+i)})  ${o}</button>`;
  }).join('');
  el.innerHTML=`
    <div class="srow">
      <span class="sm">Q ${qIdx+1}</span>
      <div style="display:flex;gap:12px"><span class="sc">✓ ${qSes.c}</span><span class="sw">✗ ${qSes.w}</span>${acc?`<span class="sa">${acc}</span>`:''}</div>
      <span></span>
    </div>
    <div class="pcard">
      <div class="plbl">Translate:</div>
      <div class="pword">${q.word.word}</div>
      <div class="pbadges">${ptag(q.word.pos)}${rb(q.word.rank)}${q.word.mx?mb():''}</div>
    </div>
    ${opts}
    ${qCh?'<button class="bnext" onclick="nq()">Next →</button>':''}`;
}
function pq(o){
  if(qCh)return;qCh=o;
  const w=qQ.word;P.seen[w.rank]=true;
  if(o===qQ.correct){P.correct[w.rank]=(P.correct[w.rank]||0)+1;qSes.c++;}
  else{P.incorrect[w.rank]=(P.incorrect[w.rank]||0)+1;qSes.w++;}
  sp();uh();rq();
}
function nq(){qIdx++;bq();rq();}

// LIST
function rl(){
  const el=document.getElementById('cnt');
  const base=gp(),q=lQ.toLowerCase();
  const fil=q.length>1?base.filter(w=>w.word.toLowerCase().includes(q)||w.translations.some(t=>t.toLowerCase().includes(q))):base;
  const pages=Math.ceil(fil.length/PP),shown=fil.slice(lPage*PP,(lPage+1)*PP);
  const items=shown.map(w=>{
    const c=P.correct[w.rank]||0,i=P.incorrect[w.rank]||0,t=c+i,a=t>0?Math.round(c/t*100):null;
    const seen=P.seen[w.rank];
    const cls=seen?(a>=80?'li lg':a!==null?'li lo':'li lm'):'li';
    return `<div class="${cls}"><span class="lrank">#${w.rank}</span><span class="lword">${w.word}</span><span class="ltrans">${w.translations[0]}</span>${ptag(w.pos)}${w.mx?'<span style="font-size:10px;color:#E8B45A">🇲🇽</span>':''}${a!==null?`<span class="lacc ${a>=80?'g':'o'}">${a}%</span>`:''}</div>`;
  }).join('');
  const pag=pages>1?`<div class="pag"><button class="pbtn" onclick="lpn(-1)" ${lPage===0?'disabled':''}>‹</button><span class="pinf">${lPage+1} / ${pages}</span><button class="pbtn" onclick="lpn(1)" ${lPage>=pages-1?'disabled':''}>›</button></div>`:'';
  el.innerHTML=`<input class="sinp" type="search" placeholder="Search Spanish or English…" value="${lQ}" oninput="lsc(this.value)">${'<div class="lcnt">'+fil.length+' words</div>'}${items}${pag}`;
}
function lsc(v){lQ=v;lPage=0;rl();}
function lpn(d){lPage+=d;rl();}

// STATS
function rs(){
  const el=document.getElementById('cnt');
  const seen=Object.keys(P.seen).length;
  const cor=Object.values(P.correct).reduce((a,b)=>a+b,0);
  const inc=Object.values(P.incorrect).reduce((a,b)=>a+b,0);
  const tot=cor+inc,acc=tot>0?Math.round(cor/tot*100):null;
  const ps={};W.forEach(w=>{const c=P.correct[w.rank]||0,i=P.incorrect[w.rank]||0;if(!ps[w.pos])ps[w.pos]={c:0,i:0};ps[w.pos].c+=c;ps[w.pos].i+=i;});
  const pr=Object.entries(ps).filter(([,v])=>v.c+v.i>0).sort((a,b)=>(a[1].c/(a[1].c+a[1].i))-(b[1].c/(b[1].c+b[1].i))).map(([p,{c,i}])=>{
    const t=c+i,a=Math.round(c/t*100),bc=a>=80?'#00A86B':a>=50?'#E8B45A':'#E74C3C';
    return `<div class="prow">${ptag(p)}<div class="pbg"><div class="pfb" style="width:${a}%;background:${bc}"></div></div><span class="ppct">${a}%</span></div>`;
  }).join('');
  const ms=W.filter(w=>(P.incorrect[w.rank]||0)>0).sort((a,b)=>(P.incorrect[b.rank]||0)-(P.incorrect[a.rank]||0)).slice(0,8);
  const mh=ms.map(w=>`<div class="mchip"><span class="mw">${w.word}</span><span class="mt">${w.translations[0]}</span></div>`).join('');
  const ac=acc>=80?'#00A86B':acc!=null?'#E8B45A':'#8BA0B4';
  el.innerHTML=`
    <div class="sgrid">
      <div class="scard"><div class="snum">${seen}</div><div class="slbl">Words seen</div></div>
      <div class="scard"><div class="snum" style="color:${ac}">${acc!=null?acc+'%':'—'}</div><div class="slbl">Accuracy</div></div>
      <div class="scard"><div class="snum" style="color:#00A86B">${cor}</div><div class="slbl">Correct</div></div>
      <div class="scard"><div class="snum" style="color:#E74C3C">${inc}</div><div class="slbl">Incorrect</div></div>
    </div>
    ${pr?`<div class="sec"><div class="sttl">By Part of Speech</div>${pr}</div>`:''}
    ${ms.length?`<div class="sec"><div class="sttl">Top Misses</div><div class="mwrap">${mh}</div></div>`:''}

  if(!a)return{ok:false};
  for(const v of acc)if(a===tcore(v,tl)||raw===tn(v))return{ok:true};
  for(const v of acc)if(tna(a)===tna(tcore(v,tl)))return{ok:true,accent:v};
  for(const v of acc){const c=tna(tcore(v,tl));if(c.length>=4&&tlev(tna(a),c)<=1)return{ok:false,close:v};}
  return{ok:false};
}

// --- question selection ---
function trange(){const r=TP.o.range;if(r==='all')return[1,1000];return[+r,+r+99];}
function tpool(){const[a,b]=trange();return TW.filter(w=>w.rank>=a&&w.rank<=b&&!TP.l[w.rank]);}
function tneed(w){const d=TP.d[w.rank]||{};let ms=TM.filter(m=>!d[m.k]);if(TP.o.mode!=='mix')ms=ms.filter(m=>m.k===TP.o.mode);return ms;}
function tnext(){
  const pool=tpool().filter(w=>tneed(w).length);
  tAns=null;
  if(!pool.length){tQ=null;return;}
  let w=null;
  const due=tRetry.findIndex(x=>x.at<=tCount&&x.rank!==tLast&&pool.some(p=>p.rank===x.rank));
  if(due>=0){w=TW[tRetry[due].rank-1];tRetry.splice(due,1);}
  if(!w){
    let cand=TP.o.order==='seq'?pool.slice(0,8):pool;
    if(cand.length>1)cand=cand.filter(x=>x.rank!==tLast);
    w=cand[Math.floor(Math.random()*cand.length)];
  }
  // Recognise before recall: list modes come before typing for each word
  let ms=tneed(w);const lists=ms.filter(m=>!m.type);if(lists.length)ms=lists;
  const m=ms[Math.floor(Math.random()*ms.length)];
  tQ={w,m,tl:m.from==='es'?'en':'es'};
  if(!m.type)tQ.opts=topts(w,tQ.tl);
  tLast=w.rank;tCount++;
}
function tlabel(x,tl){return tl==='en'?x.en:x.es;}
function topts(w,tl){
  const acc=new Set(tAccept(w,tl).map(v=>tcore(v,tl)));
  const seen=new Set([tcore(tlabel(w,tl),tl)]),ds=[];
  for(const x of sh(TW)){
    if(ds.length>=3)break;
    if(x.rank===w.rank)continue;
    if((tl==='en'?x.vEn:x.vEs).some(v=>acc.has(tcore(v,tl))))continue;
    const k=tcore(tlabel(x,tl),tl);if(seen.has(k))continue;
    seen.add(k);ds.push(tlabel(x,tl));
  }
  return sh([tlabel(w,tl),...ds]);
}

// --- answering ---
function tmark(w,k){
  const d=TP.d[w.rank]??={};d[k]=1;
  if(TM.every(m=>d[m.k])){TP.l[w.rank]=Date.now();return true;}
  return false;
}
function tresult(ok){
  const w=tQ.w;
  if(ok){tSes.c++;tAns.learned=tmark(w,tQ.m.k);}
  else{tSes.w++;tRetry.push({rank:w.rank,at:tCount+3});}
  tsp();uh();
  if(TP.o.auto)tsay(w.es);
  trender();
}
function tpick(i){
  if(tAns||!tQ)return;
  const o=tQ.opts[i];
  tAns={pick:o,ok:o===tlabel(tQ.w,tQ.tl)};
  tresult(tAns.ok);
}
function tsubmit(){
  if(tAns||!tQ)return;
  const inp=document.getElementById('tin'),v=inp?inp.value:'';
  if(!v.trim()){if(inp)inp.focus();return;}
  tAns=Object.assign({given:v},tcheck(v,tQ.w,tQ.tl));
  tresult(tAns.ok);
}
function tskip(){
  if(tAns||!tQ)return;
  tAns={given:'',ok:false,skipped:true};
  tresult(false);
}
function toverride(){
  if(!tAns||tAns.ok)return;
  const w=tQ.w;
  tAns.ok=true;tAns.over=true;tSes.w--;tSes.c++;
  const i=tRetry.findIndex(x=>x.rank===w.rank);if(i>=0)tRetry.splice(i,1);
  tAns.learned=tmark(w,tQ.m.k);
  tsp();uh();trender();
}
function tgo(){tnext();trender();}
function tset(k,v){TP.o[k]=v;tsp();tRetry=[];tnext();trender();}
function tinsert(ch){
  const el=document.getElementById('tin');if(!el||el.disabled)return;
  const s=el.selectionStart??el.value.length,e=el.selectionEnd??el.value.length;
  el.setRangeText(ch,s,e,'end');el.focus();
}

// --- speech (Mexican Spanish voice when the device has one) ---
let tVoice=null;
function tpv(){
  if(!('speechSynthesis' in window))return;
  const vs=speechSynthesis.getVoices(),l=v=>v.lang.replace('_','-').toLowerCase();
  tVoice=vs.find(v=>l(v)==='es-mx')||vs.find(v=>l(v)==='es-us')||vs.find(v=>l(v).startsWith('es'))||null;
}
if('speechSynthesis' in window){tpv();speechSynthesis.addEventListener('voiceschanged',tpv);}
function tsay(t){
  try{
    if(!('speechSynthesis' in window))return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t.replace(/\//g,', ').replace(/[()]/g,''));
    u.lang=tVoice?tVoice.lang:'es-MX';if(tVoice)u.voice=tVoice;u.rate=.9;
    speechSynthesis.speak(u);
  }catch{}
}
function tsayQ(){if(tQ)tsay(tQ.w.es);}

// --- rendering ---
function tstats(){
  const[a,b]=trange();let learned=0,steps=0;
  for(let r=a;r<=b;r++){if(TP.l[r])learned++;const d=TP.d[r];if(d)steps+=TM.filter(m=>d[m.k]).length;}
  return{learned,total:b-a+1,steps};
}
function tdots(w,cur){
  const d=TP.d[w.rank]||{};
  return `<div class="tdots">${TM.map(m=>`<span class="tdot${d[m.k]?' on':''}${m.k===cur?' cur':''}">${d[m.k]?'✓ ':''}${m.sh}</span>`).join('')}</div>`;
}
function tctrl(){
  const rs=['all'];for(let s=1;s<=901;s+=100)rs.push(String(s));
  const st=tstats();
  return `
  <div class="tctl">
    <select onchange="tset('mode',this.value)">
      <option value="mix"${TP.o.mode==='mix'?' selected':''}>🔀 Mixed (all 4)</option>
      ${TM.map(m=>`<option value="${m.k}"${TP.o.mode===m.k?' selected':''}>${m.lbl}</option>`).join('')}
    </select>
    <select onchange="tLPage=0;tset('range',this.value)">
      ${rs.map(r=>`<option value="${r}"${TP.o.range===r?' selected':''}>${r==='all'?'#1–1000':'#'+r+'–'+(+r+99)}</option>`).join('')}
    </select>
  </div>
  <div class="tctl">
    <button class="fbtn${TP.o.order==='seq'?' on':''}" onclick="tset('order',TP.o.order==='seq'?'rand':'seq')">${TP.o.order==='seq'?'🔢 In order':'🎲 Shuffle'}</button>
    <button class="fbtn${TP.o.auto?' on':''}" onclick="TP.o.auto=!TP.o.auto;tsp();trender()">🔊 Auto</button>
    <button class="fbtn${tView==='words'?' on':''}" onclick="tView=tView==='words'?'quiz':'words';trender()">📋 Words</button>
  </div>
  <div class="srow">
    <span class="sm">Learned ${st.learned} / ${st.total}</span>
    <div style="display:flex;gap:12px"><span class="sc">✓ ${tSes.c}</span><span class="sw">✗ ${tSes.w}</span></div>
  </div>`;
}
function trender(){
  const el=document.getElementById('cnt');
  if(tView==='words'){el.innerHTML=tctrl()+`<input class="sinp" id="tls" type="search" placeholder="Search Spanish or English…" value="${esc(tLQ)}" oninput="tLQ=this.value;tLPage=0;trl()"><div id="tlw"></div>`;trl();return;}
  if(!tQ){
    const st=tstats();
    el.innerHTML=tctrl()+`<div class="pcard"><div class="pword">🎉</div><div class="plbl">${st.learned===st.total?'Every word in this range is learned!':'Nothing left for this mode in this range.'}<br>Pick another range or mode above.</div></div>`;
    return;
  }
  const{w,m,tl}=tQ,a=tAns,isEs=m.from==='es';
  const prompt=isEs?w.es:w.en;
  let body='';
  if(!m.type){
    const right=tlabel(w,tl);
    body=tQ.opts.map((o,i)=>{
      let cls='obtn';
      if(a){if(o===right)cls+=' cor';else if(o===a.pick)cls+=' wrg';else cls+=' dim';}
      return `<button class="${cls}" ${a?'disabled':''} onclick="tpick(${i})">${String.fromCharCode(65+i)})  ${esc(o)}</button>`;
    }).join('');
  }else{
    body=`<input class="sinp tin${a?(a.ok?' ok':' bad'):''}" id="tin" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="${a?'next':'done'}" lang="${tl}" placeholder="Type the ${tl==='en'?'English':'Spanish'}…" value="${a?esc(a.given):''}" ${a?'disabled':''}>`;
    if(!a){
      body+=(tl==='es'?`<div class="tacc">${['á','é','í','ó','ú','ñ','ü','¿','¡'].map(c=>`<button onpointerdown="event.preventDefault()" onclick="tinsert('${c}')">${c}</button>`).join('')}</div>`:'')
        +`<div class="brow2"><button class="btn bskip" onclick="tskip()">I don't know</button><button class="btn bright" onclick="tsubmit()">Check</button></div>`;
    }
  }
  let fb='';
  if(a){
    const ans=tlabel(w,tl),also=tAccept(w,tl).filter(v=>tcore(v,tl)!==tcore(ans,tl)&&!tvars(ans).includes(v)&&v!==ans);
    if(a.ok){
      fb=`<div class="tfb good"><b>✓ ${a.over?'Counted as correct':'Correct!'}</b>`
        +(a.accent?`<div>Watch the accents: <b>${esc(a.accent)}</b></div>`:'')
        +(m.type&&tn(a.given)!==tn(ans)&&!a.accent?`<div>Listed answer: <b>${esc(ans)}</b></div>`:'')
        +(a.learned?`<div class="tlearn">🎉 Learned! “${esc(w.es)}” won't be shown again.</div>`:'')+`</div>`;
    }else{
      fb=`<div class="tfb bad"><b>${a.skipped?'The answer is…':a.close?'✗ So close — check the spelling':'✗ Not quite'}</b>`
        +`<div>Answer: <b>${esc(ans)}</b>${also.length?` <span class="sm">(also: ${esc(also.slice(0,4).join(', '))})</span>`:''}</div>`
        +`<div class="sm">It'll come back in a few questions.</div></div>`
        +(m.type&&!a.skipped?`<button class="fbtn tover" onclick="toverride()">I was right — count it</button>`:'');
    }
    fb+=`<button class="bnext" onclick="tgo()">Next →</button>`;
  }
  el.innerHTML=tctrl()+`
    <div class="pcard">
      <div class="plbl">${m.lbl} — ${m.type?'type the answer':'choose the answer'}</div>
      <div class="pword">${esc(prompt)}${isEs||a?` <button class="tspk" onclick="tsayQ()" aria-label="Hear it">🔊</button>`:''}</div>
      ${!isEs&&a?`<div class="plbl">${esc(w.es)}</div>`:''}
      <div class="pbadges">${rb(w.rank)}</div>
      ${tdots(w,m.k)}
    </div>
    ${body}${fb}`;
  if(m.type&&!a){const i=document.getElementById('tin');if(i)i.focus();}
}
function trl(){
  const box=document.getElementById('tlw');if(!box)return;
  const[a,b]=trange(),q=tn(tLQ);
  let ws=TW.filter(w=>w.rank>=a&&w.rank<=b);
  if(q)ws=ws.filter(w=>tn(w.es).includes(q)||tna(tn(w.es)).includes(tna(q))||tn(w.en).includes(q));
  const pages=Math.max(1,Math.ceil(ws.length/PP));if(tLPage>=pages)tLPage=pages-1;
  const items=ws.slice(tLPage*PP,(tLPage+1)*PP).map(w=>{
    const d=TP.d[w.rank]||{},n=TM.filter(m=>d[m.k]).length,lr=!!TP.l[w.rank];
    return `<div class="li ${lr?'lg':n?'lo':''}"${lr||n?` onclick="treset(${w.rank})"`:''}><span class="lrank">#${w.rank}</span><span class="lword">${esc(w.es)}</span><span class="ltrans">${esc(w.en)}</span><span class="tmini">${TM.map(m=>`<i class="${d[m.k]?'on':''}"></i>`).join('')}</span>${lr?'<span class="lacc g">✓</span>':''}</div>`;
  }).join('');
  box.innerHTML=`<div class="lcnt">${ws.length} words · tap a word with progress to reset it</div>${items||'<p class="emp">No words match.</p>'}`
    +(pages>1?`<div class="pag"><button class="pbtn" onclick="tLPage--;trl()" ${tLPage===0?'disabled':''}>‹</button><span class="pinf">${tLPage+1} / ${pages}</span><button class="pbtn" onclick="tLPage++;trl()" ${tLPage>=pages-1?'disabled':''}>›</button></div>`:'');
}
function treset(r){
  const w=TW[r-1];
  if(!confirm(`Reset progress for “${w.es}”? It will start appearing again.`))return;
  delete TP.d[r];delete TP.l[r];tsp();uh();
  if(!tQ)tnext();
  trl();
}
document.addEventListener('keydown',e=>{
  if(tab!=='top'||tView!=='quiz'||e.key!=='Enter'||!tQ)return;
  if(!tAns&&tQ.m.type){e.preventDefault();tsubmit();}
  else if(tAns){e.preventDefault();tgo();}
});

lp();tlp();
let t0='top';try{t0=localStorage.getItem('es1000_tab')||'top';}catch{}
sw(['top','cards','quiz','list','stats'].includes(t0)?t0:'top');
</script>
</body>
